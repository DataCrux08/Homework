<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Game</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #a2a4a8 ;
        }

        .game{
            width:1000px;
            height: 500px;
            border: 2px solid black;
            overflow: hidden;
            position: relative;
            background: linear-gradient(rgb(12, 65, 240) , white);

        }
        .world{
            position: absolute;
            width: 4000px;
            height: 100%;
            left: 0;
            top: 0;

        }
        .pipe pipe1{
            background-size: contain;
            left: 40px;
            position: absolute;


        }
        .ground{
            width: 100%;
            height: 70px;
            background-color: saddlebrown;
            position: absolute;
            bottom: 0;
            /* overflow: hidden; */

        }
        .player{
            height: 60px;
            width: 49px;
            left: 40px;
            bottom: 67px;
            background-repeat: no-repeat;
            background: url("assets/goku_run_transparent.gif");
            position: absolute;
            background-size:contain;
            /* background-size: auto; */

        }
        .cloud{
            width: 100px;
            height: 60px;
            border-radius: 50px;
            background: white;
            position: absolute;
        }
        .cloud1{
            top: 40px;
            left: 150px;
        }
        .cloud2{
            top:155px;
            left: 600px;
        }

        .question{
            width: 50px;
            height: 50px;
            background: gold;
            border: 3px solid red;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 37px;
            font-weight: bold;

            position: absolute;
            top:180px;

        }
        .q1{
            left: 1300px;

        }
        .q2{
            left: 1360px;
        }
        .q3{
            left: 1400px;
        }

        .brick{
            width: 50px;
            height: 50px;
            background-color: saddlebrown;
            border: 2px solid black;
            top: 220px;
            position: absolute;
        }
        .b1{
            left: 200px;
        }
        .b2{
            left: 750px;
        }
        .pipe{
            width: 80px;
            position: absolute;
            bottom: 55px;
        }
        .pipe1{
            left: 300px;
        }
        .pipe2{
            left: 600px;
        }
        .pipe3{
            left: 900px;
        }
    </style>
</head>
<body>
    <div class="game">
        <div class="world">
            <!-- Clouds -->
             <div class="cloud cloud1"></div>
             <div class="cloud cloud2"></div>

             <!-- Blocks -->
              <div class="question q1"></div>
              <div class="question q2"></div>
              <div class="question q3"></div>

              <!-- Brick -->
              <div class="brick b1"></div>
              <div class="brick b2"></div>

              <!-- Pipes -->
              <img src="assets/pipe.png" alt="pipe" class="pipe pipe1">
              <img src="assets/pipe.png" alt="pipe" class="pipe pipe2">
              <img src="assets/pipe.png" alt="pipe" class="pipe pipe3">

              <!-- Mushroom -->
               <img src="" alt="">
        </div>
        
        <!-- player -->
        <div class="player"></div>
        <!-- Ground -->
         <div class="ground"></div>
    </div>
    <script>
        const game = document.querySelector(".game")
        const world = document.querySelector(".world")
        const player = document.querySelector(".player")

        let playerX = 50;
        let playerY = 67;

        let velocity = 0;
        let gravity = 0.8
        
        let isJumping = false;
        
        function gameLoop(){
            velocity -= gravity
            playerY += velocity

            player.style.left = `${playerX}px`
            requestAnimationFrame(gameLoop)
        }
        window.addEventListener("keydown", function(e){
            
            if(e.key === 'ArrowRight'){
                playerX += 15;
                player.style.rotate = "none";
            }
            
            if(e.key === 'ArrowLeft'){
                playerX -= 15
                player.style.rotate = "y 180deg";
            }

            if((e.key === "space" || e.key === "ArrowUp" || e.key === "w") && !isJumping){
                velocity = 15
                isJumping = true
            }
        })
        gameLoop()
    </script>
</body>
</html>
