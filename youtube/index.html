<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header id="header">
        <div class="name">
            <img class = "name" src="https://cdn.creazilla.com/icons/3245994/youtube-icon-md.png" alt="Logo">
            <p class="name">Youtube</p>
            <span id="sub">IN</span>
        </div>
        <div class="searchbar">
            <input type="text" class="searchbar" placeholder="Search">
            <span class="searchbar"></span>
        </div>
        <div id="user">
            
        </div>
    </header>
    <!-- Video Section -->
    <main>
        <div class="main">
            <div class="video_box"> 
                <iframe class="video_frame" src="https://www.youtube.com/embed/xYbLpsEhcfA?si=_AR05kV7NhLNRb9N"></iframe>
                <p class="video_text">Maa Behen | Official Trailer | Madhuri Dixit, Triptii Dimri, Dharna Durga, Ravi Kishan</p>
            </div>
            <div class="video_box">
                <iframe class="video_frame" src="https://www.youtube.com/embed/-YaRRFrXW9M?si=BKhLbYRDYajFkWhi"></iframe>
                <p class="video_text">India’s Most Beautiful Islands : Havelock & Neil | Life in Andaman and Nicobar | Nishant Parmar </p>
            </div>
            <div class="video_box">
                <iframe class="video_frame" src="https://www.youtube.com/embed/U6KW8OLpl2Y?si=2SGjuA7czbrHXosl"></iframe>
                <p class="video_text">Boney M - Rasputin (Lyrics) </p>
            </div>
        </div>
    </main>
</body>
</html>
