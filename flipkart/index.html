<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flipkart-clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header Section -->
    <header class="header">
        <div class="top">
            <div class="logo">Flipkart</div>
            <div class="travel">travel</div>
            <div class="location">Vadodara, Gujarat</div>
        </div>
        <div class="middle">
            <input type="text" placeholder="Search for Products, Brand and More" id="search">
            <span>Login</span>
            <span>More</span>
            <span>Cart</ span>
        </div>
        <div class="bottom">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </header>
    <hr style="opacity: 60%;">
    <!-- Hero Section -->
    <section id="hero">
        <div class="images">
          <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/55eaae810e977cff.png?q=60" alt="image1">
        </div>
        <div class="images">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/e5fb543c103ec74d.png?q=60" alt="image2">
        </div>
        <div class="images">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/3690412c257ac1bf.png?q=60" alt="image3">
        </div>
    </section>


    <!-- recommendation section -->
     <section id="recommendation">
        <div class="item">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/2362be24b31ff347.png?q=60" alt="rec1" height="150px" width="150px">
            <p>49$</p>
        </div>
        <div class="item">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/6dc7689455f8cfef.png?q=60" alt="rec2" height="150px" width="150px">
            <p>37$</p>
        </div>
        <div class="item">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/5f37c4ecca8c4231.png?q=60" alt="rec3" height="150px" width="150px">
            <p>50$</p>
        </div>
     </section>

     <!-- Footer Section -->

     <footer class="footer">
        <div id="description">
            <h2>Flipkart</h2>
            <p>Best Place to Buy</p>
        </div>
        <div id="about">
            <h2>About</h2>
            <p>About Us</p>
            <p>Contact Us</p>
            <p>Career</p>
            <p>Information</p>
        </div>
        <div id="help">
            <h2>Help</h2>
            <p>Payment</p>
            <p>Orders</p>
            <p>Cancellation</p>
            <p>FAQ</p>
        </div>
        <p style="text-align: center;">&copy; 2026 All Rights Reserved</p>
     </footer>

</body>
</html>
